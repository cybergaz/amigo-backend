# /etc/nginx/snippets/amigo-errors.conf — what clients get when no backend
# slot answers (SYNC_V2 RC-1). Include it ONCE, at SERVER level, in the
# api.amigochats.com server {} block:
#
#     include snippets/amigo-errors.conf;
#
# and DELETE the old lines it replaces in that block:
#
#     error_page 500 502 503 504 /50x.html;     (or any error_page for 502/503/504)
#     location = /50x.html { ... }
#
# Why: prod's server block sends 502/503/504 to /50x.html, a file that does
# not exist there, so during every backend restart (seen 2026-10-13
# 08:44-08:48 UTC) EVERY client got 404 Not Found instead of a 5xx. Old app
# builds treat a 404 on the send path as "server answered, request refused"
# and stay on a dead transport instead of retrying. Every app build treats
# a 5xx as a transport failure and retries (Retry-After is a hint for that),
# and a tiny JSON body is cheap on bad Wi-Fi. Cloudflare passes an origin 503
# through; an origin 502/504 may be replaced by Cloudflare's own HTML page.
#
# Scope: only errors nginx itself produces — upstream refused / timed out
# (502/504) or none available (503). proxy_intercept_errors stays OFF
# (default): a 503 the BACKEND sends (e.g. the upload gate refusing a large
# upload with its own JSON) must reach the client unchanged.
#
# Inheritance: server-level error_page applies to every location that does
# NOT define its own error_page. The amigo locations in
# api-locations.example.conf define none; keep it that way.

error_page 502 503 504 = @amigo_unavailable;

location @amigo_unavailable {
    default_type application/json;
    # A restart / slot swap is over in seconds; 5 s spreads the retry herd
    # without making a phone on a 10 s background-network window give up.
    add_header Retry-After 5 always;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":"unavailable"}';
}
