# /etc/nginx/conf.d/amigo-upstreams.conf — http context (SYNC_V2 §13.10.5)
#
# Both slots are always listed. The stopped slot refuses connections
# instantly (localhost), nginx moves to the next server and marks it down
# for fail_timeout, so A/B swaps need NO nginx reload. Defining these
# upstreams changes nothing until a location proxies to them (CUTOVER.md
# step 0 installs this file early on purpose).
#
# Main-context settings to check in /etc/nginx/nginx.conf (do NOT put them
# here; this file is included inside http {}):
#   events { worker_connections 8192; }   # each WS = 2 connections (V4)
#   worker_rlimit_nofile 32768;
#   Leave worker_shutdown_timeout UNSET. A short value turns every reload
#   (certbot renewals included) into a mass 1006 disconnect of every
#   WebSocket. Reloads are not free: batch them.

upstream amigo_http {
    least_conn;
    server 127.0.0.1:5101 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:5102 max_fails=2 fail_timeout=5s;   # stopped slot = connect refused → next
    keepalive 32;
    keepalive_timeout 25s;      # < Bun idleTimeout 40 s: avoids reuse-after-close 502s
    keepalive_requests 10000;
}

upstream amigo_ws {
    least_conn;
    server 127.0.0.1:5201 max_fails=1 fail_timeout=3s;
    server 127.0.0.1:5202 max_fails=1 fail_timeout=3s;
}
