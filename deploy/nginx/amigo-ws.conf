# /etc/nginx/snippets/amigo-ws.conf — shared WebSocket proxy settings,
# included by the /chat locations (SYNC_V2 §13.10.5).
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_connect_timeout 2s;
# A stopped / draining slot refuses the connect → the handshake is retried
# on the other slot before the client ever sees an error.
proxy_next_upstream error timeout;
proxy_next_upstream_tries 2;
proxy_read_timeout 86400s;
proxy_send_timeout 86400s;
proxy_buffering off;
