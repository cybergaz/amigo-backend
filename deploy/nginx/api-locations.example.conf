# EXAMPLE — the location blocks for the api.amigochats.com server {} block
# after the cutover to systemd slots (SYNC_V2 §13.10.5). This is NOT a
# drop-in file: edit your existing server block (the one with the TLS /
# certbot lines; note there is a duplicate certbot `server_name
# api.amigochats.com` block in sites-enabled/default — edit the one nginx
# actually uses, check with `sudo nginx -T | less`).
#
# Rule: keep today's proxy_pass URI forms, change only the TARGET (V4).
#   today  proxy_pass http://127.0.0.1:5002;        → proxy_pass http://amigo_ws;
#   today  proxy_pass http://127.0.0.1:5002/chat/;  → proxy_pass http://amigo_ws/chat/;
#   today  proxy_pass http://127.0.0.1:5000;        → proxy_pass http://amigo_http;
# A URI part after the host must be carried over exactly, or paths change.
#
# What exists in prod today (2026-10-13 recon) and what happens to it:
#   location = /chat      added by you (kills the 301 on every WS connect)
#                         → retarget to amigo_ws
#   location /chat/       WS → :5002                → retarget to amigo_ws
#   location /chat/sse    → :5002. No SSE route exists in the backend (old
#                         or new) and the app never calls it. Delete it;
#                         if you keep it, retarget it to amigo_ws.
#   location /chat/poll   → :5002 (35 s read timeout). DELETE it: the WS
#                         server has no poll routes. v1 polling is
#                         /api/chat/poll/* and already goes through "/".
#   location /            → :5000                   → retarget to amigo_http
# New:
#   location = /api/readyz   localhost only (wait-ready.sh talks to the
#                            slot directly; the public must not see it)
#   location /api/chat/sync/poll   only needed from R3 (poll v2); harmless now

    location = /chat {
        proxy_pass http://amigo_ws;               # same URI form as your /chat/ block
        include snippets/amigo-ws.conf;
    }

    location /chat/ {
        proxy_pass http://amigo_ws;               # keep today's URI form
        include snippets/amigo-ws.conf;
    }

    location = /api/readyz {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://amigo_http;
    }

    location / {
        proxy_pass http://amigo_http;             # keep today's URI form
        # Upstream keepalive needs HTTP/1.1 and an empty Connection header.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        # Retries only when the connect fails or times out before a request
        # was sent; non-idempotent POSTs are never retried after that.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_read_timeout 60s;
        # Keep any directives your current "/" block has that are not listed
        # here (client_max_body_size for media uploads in particular).
    }

    location /api/chat/sync/poll {                # R3; server wait ≤ 25 s
        proxy_pass http://amigo_http;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 45s;
        proxy_buffering off;
    }

# Cloudflare (optional, after V12): nginx sees Cloudflare IPs as
# $remote_addr today. To log/limit by the real client:
#   set_real_ip_from <each Cloudflare range>;  real_ip_header CF-Connecting-IP;
# Restricting origin :443 to Cloudflare ranges is decision D-C8.
