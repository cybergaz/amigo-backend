# /etc/systemd/journald.conf.d/amigo.conf — keep amigo@N logs for 7+ days
# (SYNC_V2 RC-1).
#
# Why: once the backend runs under systemd, its stdout goes to journald, and
# journald's default cap (10 % of the filesystem, at most 4 GiB, shared with
# every other unit) can rotate a busy week away. "Missing messages on one
# phone" reports arrive days later: the 2026-10-13 report needed the bun log
# for 19:50-20:41 UTC and tmux scrollback had already dropped it. The
# [FANOUT] / [POLL] / [FCM] lines only help if they are still there.
#
# SIZING — measure, then set SystemMaxUse to at least 10x one day of logs
# (7 days + margin; journald compresses, but the index and the other units
# also count):
#   1. Day 0, after the cutover:   sudo journalctl --disk-usage
#   2. Day 1, same time:           sudo journalctl --disk-usage
#      daily growth = day1 - day0  (or, quicker but rougher:
#      sudo journalctl -u 'amigo@*' --since -1d -o export | wc -c)
#   3. Check room: df -h /var/log  — SystemMaxUse + SystemKeepFree must fit.
# The 4G below is a starting point for a ~30 GiB root disk. Raise it if one
# day of amigo logs is above ~400 MB.
#
# Install (CUTOVER.md step 0, while prod still runs in tmux, so restarting
# journald touches no amigo slot):
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo install -m 0644 deploy/journald/amigo.conf /etc/systemd/journald.conf.d/
#   sudo systemctl restart systemd-journald
# Check: systemd-analyze cat-config systemd/journald.conf | tail -8
# A week later: journalctl -u 'amigo@*' --since -7d | head -1   (must print a line)

[Journal]
# Survive reboots (Ubuntu's default "auto" already does when
# /var/log/journal exists; explicit so it never silently falls back to RAM).
Storage=persistent
SystemMaxUse=4G
SystemKeepFree=2G
# Smaller files rotate (and get deleted) in smaller steps.
SystemMaxFileSize=256M
# No MaxRetentionSec: size is the only limit, so a quiet week keeps more.
